# SPDX-License-Identifier: MIT
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    # Core and correctness
    - bodyclose
    - copyloopvar
    - errcheck
    - govet
    - nilerr
    - noctx
    - reassign
    - staticcheck
    - unused

    # Style, performance, and idioms
    - goconst
    - ineffassign
    - misspell
    - mnd
    - perfsprint
    - predeclared
    - revive
    - whitespace

    # Complexity and meta
    - cyclop
    - nolintlint

    # Security
    - gosec

  settings:
    misspell:
      locale: US
    goconst:
      ignore-tests: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
