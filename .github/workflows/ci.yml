name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Enforce gofmt
        run: test -z "$(gofmt -l .)"

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.14.0
          args: --config=.golangci.yml

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.22.x", "1.27.x"]
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Run tests
        run: go test -count=1 ./...

      - name: Run race detector
        run: go test -race -count=1 ./...

  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate coverage profile
        run: go test -count=1 -coverprofile=coverage.out ./...

      - name: Enforce 90% coverage
        run: |
          total=$(go tool cover -func=coverage.out | tail -n 1 | awk '{print $3}' | tr -d '%')
          awk -v total="$total" 'BEGIN {
            if (total + 0 < 90) {
              printf "coverage %s%% is below the 90%% threshold\n", total
              exit 1
            }
            printf "coverage %s%% meets the 90%% threshold\n", total
          }'

      - name: Upload coverage profile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Fuzz Lookup
        run: go test ./pkg/currency -run=^$ -fuzz=FuzzLookup -fuzztime=30s -count=1

      - name: Fuzz Round
        run: go test ./pkg/currency -run=^$ -fuzz=FuzzRound -fuzztime=30s -count=1

      - name: Fuzz NewEntry
        run: go test ./pkg/core -run=^$ -fuzz=FuzzNewEntry -fuzztime=30s -count=1

      - name: Fuzz ValidateTransaction
        run: go test ./pkg/core -run=^$ -fuzz=FuzzValidateTransaction -fuzztime=30s -count=1

  mutation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run mutation tests
        run: go test -tags=mutation ./pkg/core -run TestMutations -count=1 -v

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check SPDX headers
        run: bash scripts/check-spdx.sh

      - name: Check documentation guidance
        run: bash scripts/check-docs.sh

      - name: Run API and no-float checks
        run: go test -count=1 -run 'TestAPIGolden|TestNoFloatInMoneyPath' ./pkg/...

  govulncheck:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.x"
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Run govulncheck
        run: |
          "$(go env GOPATH)/bin/govulncheck" ./...
